{% extends "base.html" %}
{% block title %}Crear cuenta · CarnetUACH Ingeniería{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 mt-3">Crear cuenta de alumno</h1>
    <form method="post" class="panel row g-3">
      <div class="col-sm-6">
        <label class="form-label" for="nombre">Nombre</label>
        <input class="form-control" id="nombre" name="nombre" value="{{ form.get('nombre', '') }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="apellidos">Apellidos</label>
        <input class="form-control" id="apellidos" name="apellidos" value="{{ form.get('apellidos', '') }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="matricula">Matrícula</label>
        <input class="form-control" id="matricula" name="matricula" value="{{ form.get('matricula', '') }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="semestre">Semestre</label>
        <input class="form-control" id="semestre" name="semestre" type="number" min="1" max="12" value="{{ form.get('semestre', '') }}" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="id_carrera">Carrera</label>
        <select class="form-select" id="id_carrera" name="id_carrera" required>
          <option value="">Elige tu carrera</option>
          {% for c in carreras %}
            <option value="{{ c.id_carrera }}" {{ 'selected' if form.get('id_carrera') == c.id_carrera|string }}>{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="correo">Correo</label>
        <input class="form-control" id="correo" name="correo" type="email" value="{{ form.get('correo', '') }}" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="password">Contraseña (mínimo 8 caracteres)</label>
        <input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary">Crear cuenta</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('login') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
