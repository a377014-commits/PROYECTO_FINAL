{% extends "base.html" %}
{% block title %}Iniciar sesión · CarnetUACH Ingeniería{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mt-4">Carnet de actividades</h1>
    <p class="text-secondary">Facultad de Ingeniería, UACH. Inicia sesión para ver eventos y tu avance.</p>
    <form method="post" class="panel">
      <div class="mb-3">
        <label class="form-label" for="correo">Correo</label>
        <input class="form-control" id="correo" name="correo" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100">Iniciar sesión</button>
    </form>
    <p class="mt-3 text-center">¿Eres alumno y aún no tienes cuenta? <a href="{{ url_for('registro') }}">Crear cuenta</a></p>
  </div>
</div>
{% endblock %}
